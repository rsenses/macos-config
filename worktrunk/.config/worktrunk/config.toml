worktree-path = ".worktrees/{{ branch | sanitize }}"
skip-commit-generation-prompt = true

[[pre-start]]
copy = "wt step copy-ignored"

[[pre-start]]
mise = """
if command -v mise >/dev/null 2>&1; then
  if mise trust .; then
    mise install
  else
    printf 'mise: la confianza no fue concedida; se cancela la preparación del worktree.\n' >&2
    exit 1
  fi
fi
"""

[post-switch]
# Populate missing ignored files when entering an existing worktree.
# Without --force, local copies (including .env) are never overwritten.
copy_missing = "wt step copy-ignored"

[commit.generation]
command = '''f=$(mktemp); trap 'rm -f -- "$f"' EXIT; printf '\n\n' > "$f"; sed 's/^/# /' >> "$f"; ${EDITOR:-vi} "$f" < /dev/tty > /dev/tty; grep -v '^#' "$f"'''

[projects]
